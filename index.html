<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BIG BOI Pinball Designer</title>
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="app">
    <aside id="left" class="panel housing">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <div class="inner">
        <header class="marquee"><span class="bulbs"></span><h1 class="disp" id="phaseTitle">WORKSHOP</h1></header>
        <div class="scroll">
          <div class="tile roundmap" id="roundMap" data-tip="map"></div>

          <div class="lbl">Score</div>
          <div id="score" class="odo" data-tip="score"></div>
          <div class="goalrow" data-tip="goal"><span class="lbl">Goal <b id="goal" class="num">—</b></span><span class="lbl" id="toGo"></span></div>
          <div class="tube" data-tip="goal"><div id="goalFill"></div><span class="badge-flag"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" /><path class="pole" d="M12 25V8" /><path class="flag" d="M13 8L25 12L13 16Z" /></svg></span></div>

          <div class="instruments">
            <div class="tile inst" id="multTile" data-tip="mult">
              <div class="lbl">Mult</div>
              <div id="multDial"></div>
              <div id="mult" class="disp val">×1.00</div>
            </div>
            <div class="tile inst" id="ballsTile" data-tip="balls">
              <div class="lbl">Balls</div>
              <div id="ballTray" class="tray"></div>
              <div id="balls" class="disp val">3 LEFT</div>
            </div>
          </div>

          <div class="gauges">
            <div class="gauge" data-tip="tilt"><span class="lbl">Tilt</span><div class="bar"><div id="tiltFill"></div></div></div>
            <div class="gauge" id="clockBox" data-tip="clock"><span class="lbl">Clock <b id="clockSec" class="num"></b></span><div class="bar"><div id="clockFill"></div></div></div>
          </div>

          <div id="bossBox" class="tile boss"></div>

          <section id="ledgerBox" class="receipt-wrap" data-tip="ledger">
            <div class="slot"></div>
            <div class="paper">
              <div class="receipt">
                <div class="lbl center">This round</div>
                <table id="ledger"><tbody></tbody></table>
                <div id="ledgerEmpty" class="hint center">Roll a ball. Every point is attributed here.</div>
                <div class="rtotal"><span>ROUND TOTAL</span><b id="ledgerTotal" class="disp">0</b></div>
              </div>
              <svg class="zig" viewBox="0 0 160 8" preserveAspectRatio="none"><path d="M0 0H160V0L150 8L140 0L130 8L120 0L110 8L100 0L90 8L80 0L70 8L60 0L50 8L40 0L30 8L20 0L10 8L0 0Z" /></svg>
            </div>
          </section>

        </div>
      </div>
    </aside>

    <main id="center">
      <div id="stage"></div>
      <button id="btnPause" class="pausebtn" title="Pause (Esc)" aria-label="Pause"><i></i><i></i></button>
      <div id="upgradeBox" class="card" hidden></div>
      <div id="overlay" hidden></div>
      <div id="touch" aria-label="Touch controls">
        <button data-key="ArrowLeft" class="disp">LEFT</button>
        <button data-key="Space" class="disp">PLUNGE</button>
        <button data-key="ArrowRight" class="disp">RIGHT</button>
      </div>
      <div id="keys" class="keys"></div>
    </main>

    <aside id="right" class="panel housing">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <div class="inner">
        <header class="marquee"><span class="bulbs"></span><h2 class="disp">SHOP</h2></header>
        <div class="fixed">
          <div class="moneyrow"><span class="money" data-tip="money"><span id="coinStack" class="coins"><i></i><i></i><i></i></span><b id="shopMoney" class="disp">$0</b><span id="moneyTick" class="tick"></span></span><button id="btnReroll" class="pill">Reroll</button></div>
          <div id="invWrap">
            <div class="lbl">Toolbox</div>
            <div id="inventoryBox" class="toolbox"><div id="inventory"></div><button id="toolSell" class="latch" hidden></button></div>
          </div>
          <section id="shopBox">
            <div id="prize" hidden></div>
            <div id="offers"></div>
          </section>
          <div id="shopClosed" class="hint">The shop opens between rounds.</div>
        </div>
        <div class="scroll">
          <details id="machineBox">
            <summary class="lbl">Machine &amp; options</summary>
            <div class="card">
              <div class="lbl">Machine</div>
              <div id="themeRow" class="themes"></div>
              <div class="btnrow">
                <button id="btnUndo" title="Ctrl+Z">Undo</button>
                <button id="btnRedo" title="Ctrl+Y">Redo</button>
                <button id="btnTest" title="Space">Test ball</button>
                <button id="btnReset">New run</button>
                <button id="btnSettings">Settings</button>
              </div>
              <label>Table tilt (gravity) <b id="gravVal" class="num">50</b>
                <input id="gravity" type="range" min="30" max="80" step="1" value="50" />
              </label>
              <label class="check"><input id="heat" type="checkbox" /> Heatmap: where the balls went
                <button id="btnHeatClear" class="mini">clear</button></label>
              <div class="lbl">Layout slots</div>
              <div id="slots"></div>
              <div id="slotMsg" class="hint"></div>
              <label class="check"><input id="sandbox" type="checkbox" /> Test Lab: every part, free, nothing counts</label>
            </div>
            <div id="labTools" class="card" hidden>
              <h3 class="disp">Test Lab</h3>
              <div class="btnrow">
                <button id="labBalls4">Drop 4 balls</button>
                <button id="labBalls12">Drop 12 balls</button>
                <button id="labClear">Clear board</button>
                <button id="labLevelUp">Levels +1</button>
                <button id="labLevelDown">Levels −1</button>
              </div>
              <div class="row">
                <select id="labUpgrade" aria-label="Upgrade to take"></select>
                <button id="labTake" class="mini">Take</button>
                <button id="labDrop" class="mini">Clear all</button>
              </div>
            </div>
          </details>
        </div>
        <div class="footer">
          <div id="actions">
            <button id="btnStart" class="arcade"><span class="cap" id="startCap"></span><span class="disp">PLAY ROUND</span></button>
            <button id="btnCash" class="arcade" hidden disabled><span class="cap" id="cashCap"></span><span class="disp">CASH OUT</span></button>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <div id="tip" hidden></div>
  <div id="inspect" class="card tipcard inspect" hidden></div>
  <div id="menu" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
